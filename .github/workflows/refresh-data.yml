name: Atualizar dados (sob demanda)

# ⚠️ POLÍTICA: este é o ÚNICO ponto que chama APIs externas, e roda SOMENTE manual.
# - Sem `schedule` (cron) de propósito — nada de rodar sozinho.
# - `workflow_dispatch` = só quem tem acesso de escrita ao repo (você) consegue disparar.
# - Visitantes do site NUNCA acionam isto (o site só lê o graph.json estático).
# NÃO adicione `schedule:` aqui sem querer aumentar a frequência de requisições.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Impede rodadas simultâneas (se clicar 2x, colapsa em 1) — evita estouro de requisições.
concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Buscar dados e reconstruir graph.json
        run: python pipeline/run.py
      - name: Commit do graph.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/graph.json
          git diff --staged --quiet || git commit -m "chore(data): atualização sob demanda"
          git push
