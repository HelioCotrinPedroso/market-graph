name: Atualizar dados (sob demanda)

# Roda o pipeline (yfinance + CoinGecko + World Bank) SÓ quando você clica
# em "Run workflow". Atualiza web/data/graph.json e faz commit — o que dispara
# o deploy automático. Nada é agendado.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Buscar dados e reconstruir graph.json
        run: python pipeline/run.py
      - name: Commit do graph.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/graph.json
          git diff --staged --quiet || git commit -m "chore(data): atualização sob demanda"
          git push
